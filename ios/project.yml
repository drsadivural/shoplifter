name: RetailGuardReference
options:
  bundleIdPrefix: com.ayonix.retailguard
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your authorized RetailGuard session.
    INFOPLIST_KEY_CFBundleDisplayName: RetailGuard
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  configs:
    Debug:
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    Release:
      INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
targets:
  RetailGuardReference:
    type: application
    platform: iOS
    sources:
      - RetailGuardApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayonix.retailguard.reference
schemes:
  RetailGuardReference:
    build:
      targets:
        RetailGuardReference: all
