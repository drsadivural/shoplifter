name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-super
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RG_OWNER_PASSWORD: ci-owner
      RG_APP_PASSWORD: ci-app
      RG_WORKER_PASSWORD: ci-worker
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-super@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - name: Create database roles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          sed -e 's/--username "$POSTGRES_USER"/-h 127.0.0.1 -U postgres/' infra/postgres/10-roles.sh > /tmp/roles.sh
          PGPASSWORD=ci-super sh /tmp/roles.sh
      - name: API integration tests
        working-directory: services/api
        run: uv run pytest -q -p no:warnings
      - name: OpenAPI contract is current
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://x@127.0.0.1/x
          MEDIA_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          uv run python -m retailguard_api openapi > /tmp/openapi.json
          diff -q /tmp/openapi.json ../../packages/contracts/openapi.json
      - name: Event schema copies match
        run: |
          cmp contracts/event.schema.json services/api/src/retailguard_api/contracts/event.schema.json
          cmp contracts/event.schema.json packages/contracts/event.schema.json

  edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Edge tests
        working-directory: services/edge
        run: uv run pytest -q -p no:warnings

  edge-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - name: Build customer packages
        working-directory: services/edge
        run: uv run python deploy/package.py --out dist
      - name: Install the Windows package as a customer would (downloads uv, Python, ffmpeg)
        shell: pwsh
        run: |
          # Hide any ffmpeg the runner image has, so the installer's download path is exercised.
          Get-Command ffmpeg -All -ErrorAction SilentlyContinue | Format-Table Source
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'ffmpeg.exe')) }) -join ';'
          Expand-Archive services/edge/dist/retailguard-edge-*-windows.zip -DestinationPath C:\pkg
          $dir = (Get-ChildItem C:\pkg | Select-Object -First 1).FullName
          & "$dir\deploy\install-windows.ps1" -Api https://shoplifter.ayonix.com
          $cli = "$env:ProgramFiles\RetailGuard\Edge\bin\retailguard-edge.cmd"
          & $cli --version
          & $cli status
          if ($LASTEXITCODE -ne 0) { throw "status failed" }
          if (-not (Test-Path "$env:ProgramFiles\RetailGuard\Edge\ffmpeg\bin\ffprobe.exe")) { throw "ffmpeg was not downloaded" }
          & "$env:ProgramFiles\RetailGuard\Edge\ffmpeg\bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          & $cli discover --timeout 1 --cidr 10.0.0.0/8
          if ($LASTEXITCODE -ne 0) { throw "discover failed" }
          & $cli pair --api https://shoplifter.ayonix.com --code AAAA-BBBB-CCCC --name ci
          if ($LASTEXITCODE -ne 2) { throw "a bad pairing code must be rejected (exit 2), got $LASTEXITCODE" }
          $task = Get-ScheduledTask -TaskName "RetailGuard Edge"
          $task.Actions | Format-List Execute, Arguments
          # Running the installer again is an update and keeps the config; files created since the
          # first run (keys) must stay readable by Administrators.
          & "$dir\deploy\install-windows.ps1" -Api https://shoplifter.ayonix.com
          Get-Content "$env:ProgramData\RetailGuard\Edge\state\box.key" -Raw -AsByteStream | Out-Null
          & $cli status
          if ($LASTEXITCODE -ne 0) { throw "status after update failed" }
          "$env:ProgramFiles\RetailGuard\Edge\ffmpeg\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Edge tests (Windows, with the ffmpeg the installer downloaded)
        working-directory: services/edge
        run: uv run pytest -q -p no:warnings
      - name: Uninstall
        shell: pwsh
        run: |
          $dir = (Get-ChildItem C:\pkg | Select-Object -First 1).FullName
          Get-ScheduledTask -TaskName "RetailGuard Edge" | Format-List TaskName, State
          Get-Process | Where-Object { $_.Path -like "*RetailGuard*" } | Format-Table Id, Path
          & "$dir\deploy\uninstall-windows.ps1" -RemoveData
          if (Test-Path "$env:ProgramFiles\RetailGuard\Edge") { throw "not removed" }
      - name: Build the setup wizard (Inno Setup)
        working-directory: services/edge
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $v = uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" /O"dist" deploy\windows\RetailGuardEdge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist
      - name: Wizard screenshots (fresh install, English and Japanese)
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = (Get-ChildItem services/edge/dist/RetailGuardEdgeSetup-*.exe).FullName
          ./services/edge/deploy/windows/ci/screenshots.ps1 -Setup $setup -Out shots -Lang en -Mode fresh
          ./services/edge/deploy/windows/ci/screenshots.ps1 -Setup $setup -Out shots -Lang ja -Mode fresh
      - name: Setup wizard — silent install, update, bad code, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem services/edge/dist/RetailGuardEdgeSetup-*.exe).FullName
          function RunSetup([string[]]$a, [string]$log) {
            $p = Start-Process $setup -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log") + $a) -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "setup exit $($p.ExitCode)" }
          }
          $cli = "$env:ProgramFiles\RetailGuard\Edge\bin\retailguard-edge.cmd"
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'ffmpeg.exe')) }) -join ';'
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E3C2F4A-6C1B-4B7E-9F0A-5D2E7C1A9B30}_is1"
          RunSetup @('/SERVER=https://shoplifter.ayonix.com') C:\setup-1.log
          Get-Content "$env:ProgramData\RetailGuard\Edge\logs\setup.log" -Tail 15
          & $cli status; if ($LASTEXITCODE -ne 0) { throw "status failed" }
          if ((Get-ItemProperty $key).DisplayVersion -eq $null) { throw "not registered" }
          if (-not (Get-ScheduledTask -TaskName "RetailGuard Edge")) { throw "task missing" }
          Get-Content "$env:ProgramData\RetailGuard\Edge\config.toml" | Select-String api_base_url, ffmpeg_path
          # The wizard downloaded ffmpeg itself (download page, SHA-256 verified) and unpacked only what is needed.
          if (-not (Test-Path "$env:ProgramFiles\RetailGuard\Edge\ffmpeg\bin\ffmpeg.exe")) { throw "wizard did not install ffmpeg" }
          if (-not (Test-Path "$env:ProgramFiles\RetailGuard\Edge\ffmpeg\LICENSE.txt")) { throw "ffmpeg license missing" }
          if (-not (Select-String -Path "$env:ProgramData\RetailGuard\Edge\config.toml" -SimpleMatch "RetailGuard\Edge\ffmpeg\bin\ffmpeg.exe")) { throw "config does not use the downloaded ffmpeg" }
          Select-String -Path C:\setup-1.log -Pattern "ffmpeg.zip" | Select-Object -First 3
          # Second run = update; the config stays as it was.
          $before = Get-FileHash "$env:ProgramData\RetailGuard\Edge\config.toml"
          RunSetup @() C:\setup-2.log
          if ((Get-FileHash "$env:ProgramData\RetailGuard\Edge\config.toml").Hash -ne $before.Hash) { throw "config changed on update" }
          & $cli status; if ($LASTEXITCODE -ne 0) { throw "status after update failed" }
          # A rejected pairing code leaves the PC installed and unpaired (silent mode continues).
          RunSetup @('/CODE=AAAA-BBBB-CCCC', '/NAME=ci') C:\setup-3.log
          if (-not (Select-String -Path C:\setup-3.log -Pattern "pairing failed")) { throw "pairing failure not logged" }
          if (Test-Path "$env:ProgramData\RetailGuard\Edge\state\edge.json") { throw "must not be paired" }
      - name: Wizard screenshots (update, installing, connect page, rejected code)
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = (Get-ChildItem services/edge/dist/RetailGuardEdgeSetup-*.exe).FullName
          ./services/edge/deploy/windows/ci/screenshots.ps1 -Setup $setup -Out shots -Lang en -Mode update
          ./services/edge/deploy/windows/ci/screenshots.ps1 -Setup $setup -Out shots -Lang ja -Mode update
      - name: Setup wizard — uninstall
        shell: pwsh
        run: |
          $un = "$env:ProgramFiles\RetailGuard\Edge\unins000.exe"
          Start-Process $un -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$env:ProgramFiles\RetailGuard\Edge\.venv"); $i++) { Start-Sleep 2 }
          if (Test-Path "$env:ProgramFiles\RetailGuard\Edge\.venv") { throw "not removed" }
          if (Get-ScheduledTask -TaskName "RetailGuard Edge" -ErrorAction SilentlyContinue) { throw "task not removed" }
          if (-not (Test-Path "$env:ProgramData\RetailGuard\Edge\config.toml")) { throw "data must be kept by default" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-packages
          path: services/edge/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-screenshots
          path: shots/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  ios-core:
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: RetailGuardCore build and tests
        working-directory: apps/ios/RetailGuardCore
        run: swift build && swift test

  ios-app:
    # The only place the SwiftUI app target is compiled. No signing; simulator build only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate and build for iOS Simulator
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -project RetailGuard.xcodeproj -scheme RetailGuard \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|\*\* BUILD" build.log | sort -u | head -200; exit 1; }
          grep -E "\*\* BUILD" build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: apps/ios/build.log

  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q reference edge tests
