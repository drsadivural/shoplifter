[project]
name = "retailguard-edge"
version = "0.3.1"
description = "Ayonix RetailGuard store-local edge appliance service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pynacl==1.6.2",
    "pillow==12.3.0",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
retailguard-edge = "retailguard_edge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retailguard_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a local docker daemon and the bluenviron/mediamtx image"]
