# XcodeGen spec for the Ayonix RetailGuard iOS responder app.
# Generate on a Mac:  cd apps/ios && xcodegen generate
# Signing: copy Config/Signing.xcconfig.example → Config/Signing.xcconfig (git-ignored).
name: RetailGuard

options:
  bundleIdPrefix: com.ayonix.retailguard
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Colors are referenced via Color("RG…") in Design/Theme.swift; disable
    # generated asset symbols to avoid duplicate Color.rgPrimary declarations.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO

packages:
  RetailGuardCore:
    path: RetailGuardCore

targets:
  RetailGuard:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: RetailGuard
    settings:
      base:
        PRODUCT_NAME: RetailGuard
        PRODUCT_BUNDLE_IDENTIFIER: $(RG_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/RetailGuard.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: RetailGuardCore
        product: RetailGuardCore

  RetailGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RetailGuardTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayonix.retailguard.responder.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    # Hosted by the app (TEST_HOST/BUNDLE_LOADER): RetailGuardCore symbols
    # resolve against the app binary, so the package is not linked twice.
    # RetailGuardCore's own XCTest suite runs with `swift test`.
    dependencies:
      - target: RetailGuard

schemes:
  RetailGuard:
    build:
      targets:
        RetailGuard: all
        RetailGuardTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RetailGuardTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
