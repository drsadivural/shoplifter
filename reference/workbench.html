<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RetailGuard • Connected reference</title><link rel="stylesheet" href="/design/ui.css"><style>body{padding:25px;max-width:1300px;margin:auto}.shell-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}textarea{min-height:100px}.record{margin:12px 0}#error{color:var(--danger);padding:12px;white-space:pre-wrap}.hidden{display:none!important}.workbench-photos{display:flex;gap:10px;flex-wrap:wrap}.workbench-photos img{width:100px;height:100px;object-fit:cover;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="shell-head"><div class="brand"><span class="mark">◈</span>RetailGuard</div><div><button id="lang" class="secondary">日本語 / English</button> <button id="theme" class="secondary">◐</button> <a class="btn secondary" href="/design/">Design gallery</a></div></div><div class="notice" id="boundary"></div><div id="error" role="alert"></div><section id="login" class="card"><h1 data-en="Sign in to local reference" data-ja="ローカル参照アプリにログイン"></h1><p data-en="Run the initializer to obtain your generated local administrator password." data-ja="初期化コマンドで生成された管理者パスワードを使用してください。"></p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" value="admin@local.retailguard" required></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button data-en="Sign in" data-ja="ログイン"></button></form></section><section id="workspace" class="hidden"><div class="tabs"><button data-page="incidents" data-en="Incidents & search" data-ja="事案・検索"></button><button data-page="profiles" data-en="Enrollment & photos" data-ja="登録・写真"></button><button data-page="cameras" data-en="Cameras" data-ja="カメラ"></button><button data-page="audit" data-en="Audit" data-ja="監査"></button><button id="logout" class="secondary" data-en="Sign out" data-ja="ログアウト"></button></div><div id="content"></div></section><script src="/workbench.js"></script></body></html>
